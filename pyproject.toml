[project]
name = "brewfather-backup"
version = "0.1.0"
description = "Back up recipes, batches, and inventory from Brewfather."
authors = [
    { name = "Bennett Clews", email = "bennett.clews@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.26.5",
]

[project.scripts]
brewfather-backup = "brewfather_backup.cli:app"

[project.urls]
Repository = "https://github.com/bclews/brewfather-bak"
Issues = "https://github.com/bclews/brewfather-bak/issues"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "respx>=0.23.1",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
