version: 2
updates:
  # Keep the action versions in our workflows current (security fixes, the
  # periodic Node runtime bumps, etc.). Python dependencies are handled by the
  # scheduled `uv lock --upgrade` workflow instead, so they are not listed here.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One combined PR for all action bumps rather than one per action.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
