name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provisions the toolchain declared in mise.toml (Python 3.13 + uv).
      - uses: jdx/mise-action@v2

      - name: Sync dependencies
        run: mise run setup

      # Lint (ruff) + type-check (mypy, strict) + test (pytest).
      - name: Check
        run: mise run check
